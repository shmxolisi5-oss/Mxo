<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hairbook</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Manrope:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --plum:#2a1030; --plum-deep:#1a0a1f; --rose:#f2a7b8; --blush:#ffe3e8; --gold:#e6c28a; --orchid:#a64b8c;
  --text:#fff4f6; --muted:#d9bccb;
  --serif:"Cormorant Garamond",Georgia,serif; --sans:"Manrope",system-ui,-apple-system,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;height:100%;background:var(--plum-deep);color:var(--text);font-family:var(--sans);-webkit-tap-highlight-color:transparent}
.app{position:relative;height:100%;max-width:480px;margin:0 auto;overflow:hidden;
  background:radial-gradient(120% 70% at 85% 0%,#6b2a63 0%,transparent 60%),radial-gradient(90% 60% at 0% 100%,#4a1d4f 0%,transparent 65%),var(--plum)}
.orb{position:absolute;border-radius:50%;filter:blur(8px);pointer-events:none}
.orb.a{width:260px;height:260px;right:-90px;top:60px;background:radial-gradient(circle at 30% 30%,var(--rose),#c9608f 55%,transparent 72%);opacity:.55}
.orb.b{width:120px;height:120px;left:-40px;top:300px;background:radial-gradient(circle at 30% 30%,var(--gold),transparent 70%);opacity:.35}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;padding:28px 24px 28px;
  transition:opacity .35s ease,transform .35s ease}
.screen[hidden]{display:none}
.screen.out{opacity:0;transform:translateX(-24px)}
.screen.in{animation:in .35s ease both}
@keyframes in{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}
.brand{font-family:var(--serif);font-size:26px;font-weight:600;letter-spacing:.02em;color:var(--blush)}
.hero{margin-top:auto;position:relative}
h1{font-family:var(--serif);font-weight:600;font-size:clamp(64px,22vw,96px);line-height:.9;margin:0 0 18px;letter-spacing:-.01em;color:var(--blush)}
.tag{font-family:var(--serif);font-style:italic;font-size:clamp(24px,7vw,30px);line-height:1.2;margin:0 0 32px;color:var(--rose)}
.tag span{display:block;color:var(--text)}
.cta{width:100%;border:0;cursor:pointer;font:700 18px var(--sans);color:var(--plum-deep);padding:22px 20px;border-radius:999px;
  background:linear-gradient(135deg,var(--blush),var(--rose) 55%,var(--gold));box-shadow:0 14px 34px rgba(242,167,184,.35);
  transition:transform .15s ease}
.cta:active{transform:scale(.97)}
.auth{display:flex;gap:12px;margin-top:14px}
.auth button{flex:1;font:600 15px var(--sans);color:var(--text);padding:15px 8px;border-radius:999px;cursor:pointer;
  background:rgba(255,255,255,.06);border:1px solid rgba(255,227,232,.28)}
.auth button:active{background:rgba(255,255,255,.14)}
button:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.back{align-self:flex-start;background:none;border:0;color:var(--muted);font:600 15px var(--sans);padding:10px 0;cursor:pointer}
h2{font-family:var(--serif);font-weight:600;font-size:clamp(40px,12vw,52px);line-height:1;margin:18px 0 10px;color:var(--blush)}
.sub{margin:0 0 28px;color:var(--muted);font-size:16px;line-height:1.5}
.choices{display:grid;gap:16px;flex:1;grid-template-rows:1fr 1fr;margin-bottom:8px}
.choice{position:relative;overflow:hidden;text-align:left;cursor:pointer;border-radius:28px;padding:24px;color:var(--text);
  border:1px solid rgba(255,227,232,.25);display:flex;flex-direction:column;justify-content:flex-end;min-height:150px;
  transition:transform .15s ease,border-color .2s}
.choice:active{transform:scale(.98)}
.choice.w{background:radial-gradient(110% 120% at 90% 0%,#e0709c 0%,transparent 60%),linear-gradient(160deg,#5a2358,#3a1740)}
.choice.m{background:radial-gradient(110% 120% at 90% 0%,#8a6bd6 0%,transparent 60%),linear-gradient(160deg,#2f2060,#1f1445)}
.choice.on{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold)}
.choice b{font-family:var(--serif);font-size:44px;font-weight:600;line-height:1}
.choice small{font-size:14px;color:var(--muted);margin-top:6px}
.note{min-height:22px;margin:12px 0 0;text-align:center;color:var(--gold);font-size:14px}
@media (prefers-reduced-motion:reduce){.screen,.cta,.choice{transition:none}.screen.in{animation:none}}

.step{color:var(--muted);font-size:13px;margin:6px 0 0}
.body{flex:1;min-height:0;overflow-y:auto;margin:0;padding:0 0 12px;-webkit-overflow-scrolling:touch}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.opt{border-radius:22px;padding:18px 14px;text-align:left;cursor:pointer;color:var(--text);font:600 16px var(--sans);
  background:rgba(255,255,255,.07);border:1px solid rgba(255,227,232,.22);display:flex;flex-direction:column;gap:8px}
.opt i{font-style:normal;font-size:30px}.opt small{color:var(--muted);font-weight:400;font-size:13px}
.opt.on,.chip.on,.pay.on{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold);background:rgba(230,194,138,.14)}
.scard{border-radius:24px;overflow:hidden;margin-bottom:16px;background:rgba(255,255,255,.07);border:1px solid rgba(255,227,232,.2)}
.ban{height:110px;display:flex;align-items:flex-end;justify-content:space-between;padding:12px 16px;
  background:linear-gradient(135deg,hsl(var(--h) 60% 55%),hsl(calc(var(--h) + 40) 55% 22%))}
.ban b{font-family:var(--serif);font-size:44px;line-height:1;color:var(--blush)}.ban span{font-size:11px;color:var(--blush);opacity:.8}
.sc{padding:16px}.sc h3{font-family:var(--serif);font-size:26px;margin:0 0 4px;color:var(--blush)}
.loc{color:var(--muted);font-size:14px;margin:0 0 10px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.tags span{font-size:12px;padding:5px 10px;border-radius:999px;background:rgba(255,227,232,.12);color:var(--text)}
.sc .cta{padding:15px;font-size:16px}.from{font-size:13px;color:var(--gold);margin:0 0 10px}
.lbl{font-weight:700;margin:18px 0 10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:12px 14px;border-radius:16px;cursor:pointer;color:var(--text);font:600 14px var(--sans);background:rgba(255,255,255,.07);border:1px solid rgba(255,227,232,.22)}
.row{display:flex;justify-content:space-between;gap:16px;padding:14px 0;border-bottom:1px solid rgba(255,227,232,.15)}
.row span{color:var(--muted)}.row b{text-align:right}.tot b{font-size:22px;color:var(--gold)}
.pay{display:block;width:100%;text-align:left;margin-bottom:10px;padding:16px;border-radius:18px;cursor:pointer;color:var(--text);font:600 15px var(--sans);background:rgba(255,255,255,.07);border:1px solid rgba(255,227,232,.22)}
.pay small{display:block;color:var(--muted);font-weight:400;margin-top:4px}
.demo{font-size:13px;line-height:1.5;color:var(--gold);background:rgba(230,194,138,.1);border-radius:14px;padding:12px 14px;margin:14px 0}
.cta:disabled{opacity:.4;box-shadow:none}.ok{font-size:56px;margin:8px 0}
.foot{padding-top:10px}
.art{width:100%;aspect-ratio:1;border-radius:14px;display:block}.fine{margin:16px 0 0;text-align:center;font-size:12px;color:var(--muted)}

.ban{position:relative}.phimg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ban b,.ban span{position:relative}.ban span{background:rgba(26,10,31,.7);padding:4px 10px;border-radius:999px;opacity:1;font-size:12px}
.adminbtn[hidden]{display:none}.adminbtn{display:block;margin:10px auto 0;background:none;border:0;color:var(--gold);font:600 13px var(--sans);text-decoration:underline;cursor:pointer;padding:8px}
.arow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid rgba(255,227,232,.15)}
.arow small{color:var(--muted)}
.fld{display:block;margin:0 0 12px;font-size:13px;color:var(--muted)}
.fld input,.fld select,.srow input{width:100%;margin-top:5px;padding:13px;border-radius:12px;border:1px solid rgba(255,227,232,.28);background:rgba(255,255,255,.08);color:var(--text);font:400 16px var(--sans)}
.fld select option{color:#000}
.srow{display:grid;grid-template-columns:1fr 84px 40px;gap:8px;margin-bottom:8px}.srow input{margin:0}
.ph{display:flex;flex-wrap:wrap;gap:10px;margin:8px 0 12px}.ph div{position:relative;width:88px;height:88px}
.ph img{width:100%;height:100%;object-fit:cover;border-radius:12px}.ph button{position:absolute;top:-6px;right:-6px;width:26px;height:26px;border-radius:50%;border:0;background:var(--rose);color:var(--plum-deep);font-weight:700;cursor:pointer}
.row2{display:flex;gap:10px;flex-wrap:wrap}.danger{border-color:#e0709c;color:#ffb3c6}
.amsg{min-height:20px;font-size:13px;color:var(--gold);margin:8px 0 0}
.cbt{display:flex;gap:8px;margin:0 0 10px}a.chip{text-decoration:none;display:inline-block}.chip[disabled]{opacity:.4;cursor:not-allowed}.fld.ck{display:flex;gap:12px;align-items:center;color:var(--text);font-size:15px}.fld.ck input{width:24px;height:24px;margin:0}
.fld input[type=date]{color-scheme:dark}

.pw{position:relative}.pw input{margin-top:0;padding-right:70px}
.eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);background:none;border:0;color:var(--rose);font:600 13px var(--sans);padding:10px;cursor:pointer}
.err{color:#ffb3c6;font-size:13px;margin:6px 0 0}.fld input.bad{border-color:#ffb3c6}
.reqs{list-style:none;margin:8px 0 14px;padding:0;font-size:13px;color:var(--muted)}.reqs li{padding:2px 0}.reqs li.ok{color:var(--gold)}
.link{background:none;border:0;color:var(--rose);font:600 14px var(--sans);text-decoration:underline;padding:10px 0;cursor:pointer}
.alt{text-align:center;color:var(--muted);font-size:14px;margin:14px 0 0}.fr{text-align:right;margin:-4px 0 6px}
.tagc{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;background:var(--gold);color:var(--plum-deep);border-radius:999px;padding:3px 9px;margin-right:6px}
</style>
</head>

  <main class="screen" id="home">

  </section>

  <section class="screen" id="flow" hidden></section>

  <section class="screen" id="auth" hidden></section>
</div>
