<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hairbook</title>
<!-- Optional: add CSS here. The fully styled design is in hairbook-supabase/index.html. -->
<style>
  /* Minimal rules so the screens stack sensibly. Replace with your own design. */
  body{font-family:system-ui,sans-serif;margin:0;padding:16px;max-width:480px}
  button{font:inherit;padding:10px 14px;margin:4px 4px 4px 0}
  .opt,.chip{display:block;margin:6px 0}
</style>
<!-- Supabase settings. Leave empty to run in demo mode (no database). -->
<script>window.HB_CONFIG={SUPABASE_URL:"",SUPABASE_ANON_KEY:""};</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
</head>
<body>

<!-- The screens the JavaScript looks for. Keep these ids and classes. -->
<main id="home">
  <h1>Hairbook</h1>
  <p>No more standing queues. Book your hairstyle in time.</p>
  <button id="book">Book your hairstyle</button>
  <div class="auth"><button type="button">Log in</button><button type="button">Create an account</button></div>
  <p class="fine">Demo preview: bookings are examples only and are not sent to salons.</p>
  <p id="acct" hidden></p>
  <button id="adminbtn" type="button" hidden>Admin dashboard</button>
</main>

<section id="choose" hidden>
  <button id="back">&larr; Back</button>
  <h2>Who is the style for?</h2>
  <button class="choice" data-v="Women">Women</button>
  <button class="choice" data-v="Men">Men</button>
</section>

<section id="flow" hidden></section>
<section id="admin" hidden></section>
<section id="auth" hidden></section>

<!-- Salon data used in demo mode. In Supabase mode the salons come from the database instead. -->
<script type="application/json" id="hb-data">{"salons": []}</script>

<script>
/* Hairbook app logic (extracted from hairbook-supabase/index.html, unchanged).
   In the app this runs inline after the #hb-data JSON block. Fill in window.HB_CONFIG to use Supabase. */
var ORIG="<!DOCTYPE html>\n"+document.documentElement.outerHTML;
var CFG=window.HB_CONFIG||{},LIVE=!!(CFG.SUPABASE_URL&&CFG.SUPABASE_ANON_KEY&&window.supabase),sb=null;
var DATA=JSON.parse(document.getElementById("hb-data").textContent);var SAL=DATA.salons;SAL.forEach(function(a){a.photos=a.photos||[];a.services=a.services||[];if(a.contactOn==null)a.contactOn=false;if(a.bookingOn==null)a.bookingOn=false;if(a.verified==null)a.verified=false;if(a.verifiedOn==null)a.verifiedOn=''});
var home=document.getElementById('home'),choose=document.getElementById('choose'),flow=document.getElementById('flow');
var S={},stack=[],cur=home;
var D={Women:"Box braids|braids|85|#1f130e;Knotless braids|braids|95|#3b2417;Cornrows|braids|60|#1f130e;Silk press|long|70|#1f130e;Balayage|long|160|#b5793f;Bob cut|bob|55|#3b2417;Curl definition|curly|75|#2a1810;Bridal updo|bun|120|#7a3b22;Layered cut|long|80|#7a3b22;Pixie cut|short|60|#d9b36a;Highlights|long|140|#c9954f;Fringe cut|bob|50|#1f130e;Wash and go|curly|65|#3b2417;Sleek ponytail|pony|65|#1f130e;French braid|pony|70|#7a3b22;Twist-out|afro|75|#2a1810;Faux locs|braids|130|#3b2417;Blowout|long|60|#3b2417;Rose colour|bob|150|#c2587a;Top knot|bun|45|#1f130e",
Men:"Skin fade|fade|20|#1f130e;Taper cut|short|18|#1f130e;Buzz cut|buzz|12|#3b2417;Beard trim|short|15|#2a1810;Twists|curly|60|#1f130e;Line-up|fade|10|#1f130e;Crew cut|short|16|#3b2417;Low fade|fade|20|#2a1810;High top fade|afro|25|#1f130e;Undercut|quiff|22|#3b2417;Pompadour|quiff|30|#7a3b22;Textured crop|short|22|#3b2417;Afro shape|afro|25|#1f130e;Dreadlocks|braids|70|#2a1810;Cornrows|braids|50|#1f130e;Quiff|quiff|25|#9a9a9f;Side part|short|18|#7a3b22;Slick back|quiff|20|#1f130e;Curly top|curly|22|#3b2417;Shape-up|fade|12|#1f130e"};
var STY={};for(var g in D)STY[g]=D[g].split(';').map(function(r){var a=r.split('|');return [a[0],a[1],+a[2],a[3]]});
var SK=['#f1c6a5','#d9a077','#b07a52','#7a4a30'];
var P={short:['','<path d="M28 52Q26 24 50 22Q74 24 72 52Q62 38 50 38Q38 38 28 52Z"/>'],
fade:['','<path d="M30 46Q32 28 50 27Q68 28 70 46Q60 38 50 38Q40 38 30 46Z"/>'],
buzz:['','<path d="M30 49Q32 33 50 32Q68 33 70 49Q60 43 50 43Q40 43 30 49Z" opacity=".85"/>'],
long:['<path d="M24 58Q20 18 50 17Q80 18 76 58L82 98L18 98Z"/>','<path d="M27 54Q30 24 50 24Q70 24 73 54Q64 36 50 36Q36 36 27 54Z"/>'],
bob:['<path d="M24 60Q20 20 50 18Q80 20 76 60L75 72L25 72Z"/>','<path d="M27 54Q30 24 50 24Q70 24 73 54Q64 36 50 36Q36 36 27 54Z"/>'],
curly:['<path d="M20 58Q10 36 26 26Q32 10 50 14Q68 10 74 26Q90 36 80 58Q82 70 74 74L26 74Q18 70 20 58Z"/>','<path d="M26 50Q30 28 50 28Q70 28 74 50Q62 38 50 38Q38 38 26 50Z"/>'],
afro:['<circle cx="50" cy="40" r="32"/>','<path d="M30 52Q32 34 50 34Q68 34 70 52Q60 42 50 42Q40 42 30 52Z"/>'],
braids:['<path d="M24 58Q20 18 50 17Q80 18 76 58L80 98L70 98L70 60L30 60L30 98L20 98Z"/>','<path d="M27 54Q30 24 50 24Q70 24 73 54Q64 36 50 36Q36 36 27 54Z"/><path d="M24 62V96M30 62V96M70 62V96M76 62V96" stroke="#0005" stroke-width="1.5"/>'],
bun:['<circle cx="50" cy="13" r="11"/>','<path d="M28 52Q26 24 50 22Q74 24 72 52Q62 38 50 38Q38 38 28 52Z"/>'],
pony:['<path d="M70 30Q96 40 84 86Q80 60 70 46Z"/>','<path d="M28 52Q26 24 50 22Q74 24 72 52Q62 38 50 38Q38 38 28 52Z"/>'],
quiff:['','<path d="M28 50Q20 20 52 16Q82 18 72 50Q62 36 50 36Q40 36 28 50Z"/>']};
function art(i,sh,col){var f=SK[i%4],h=(i*37+300)%360,p=P[sh];
return '<svg viewBox="0 0 100 100" class="art" role="img" aria-label="Illustration of '+sh+' hair"><rect width="100" height="100" fill="hsl('+h+' 45% 28%)"/><g fill="'+col+'">'+p[0]+'</g><path d="M20 100Q22 80 50 80Q78 80 80 100Z" fill="hsl('+h+' 40% 62%)"/><rect x="43" y="74" width="14" height="14" fill="'+f+'"/><ellipse cx="50" cy="58" rx="19" ry="23" fill="'+f+'"/><circle cx="43" cy="60" r="1.6" fill="#3a2418" opacity=".7"/><circle cx="57" cy="60" r="1.6" fill="#3a2418" opacity=".7"/><g fill="'+col+'">'+p[1]+'</g></svg>'}
function esc(t){return String(t==null?'':t).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function cbtn(a){if(!(a.contactOn&&(a.phone||a.email)))return '<div class="cbt"><button class="chip" disabled>Call</button><button class="chip" disabled>Email</button></div><p class="loc">Contact buttons are not enabled yet.</p>';
 return '<div class="cbt">'+(a.phone?'<a class="chip" href="tel:'+esc(String(a.phone).replace(/[^+\d]/g,''))+'">Call</a>':'')+(a.email?'<a class="chip" href="mailto:'+esc(a.email)+'">Email</a>':'')+'</div>'}
function loc(a){return [a.address,a.area,'Durban'].filter(Boolean).join(', ')}
function prc(a){var n=S.style[0].toLowerCase(),m=a.services.filter(function(x){var k=String(x.n).toLowerCase();return k&&(n.indexOf(k)>-1||k.indexOf(n)>-1)})[0];
 return m&&+m.p>0?+m.p:Math.round(S.style[2]*(a.f||1)/5)*5}
function show(to,from){from.hidden=true;to.hidden=false;to.classList.remove('in');void to.offsetWidth;to.classList.add('in');cur=to}
function price(){return prc(S.salon)}
function R(n){return 'R'+n}
function days(){var o=[],d=new Date();for(var i=0;i<7;i++){var x=new Date(d.getFullYear(),d.getMonth(),d.getDate()+i);
 o.push(x.toLocaleDateString('en-ZA',{weekday:'short',day:'numeric',month:'short'}))}return o}
var TIMES=['09:00','10:00','11:00','12:00','13:00','14:00','15:00','16:00'];
var ORDER=['style','salon','when','summary'],TITLE={style:'Pick your style',salon:'Choose a demo salon',when:'Pick a date and time',summary:'Booking summary',done:'Demo booking'};

function go(step,back){if(!back)stack.push(step);
 var h='',f='';
 if(step=='style'){h=hdr(step)+'<div class="body"><p class="sub">'+S.g+' styles. Tap one to continue.</p><div class="grid2">'+
  STY[S.g].map(function(t,i){return '<button class="opt'+(S.style&&S.style[0]==t[0]?' on':'')+'" data-a="style" data-i="'+i+'">'+(t[4]?'<img class="art" alt="" style="object-fit:cover" src="'+esc(t[4])+'">':art(i,t[1],t[3]))+t[0]+'<small>from '+R(t[2])+(t[4]?'':' · illustration')+'</small></button>'}).join('')+'</div></div>'}
 if(step=='salon'){h=hdr(step)+'<div class="body"><p class="sub">Salons for '+esc(S.style[0])+'.</p><p class="demo">'+(LIVE?'Booking requests are confirmed by the salon separately. No payment is taken.':'Salon details are entered by Hairbook and may be placeholders. No booking reaches any salon yet, and no payment is taken.')+'</p>'+(SAL.length?SAL.map(function(a,i){
  return '<div class="scard"><div class="ban" style="--h:'+(+a.h||300)+'">'+(a.photos[0]?'<img class="phimg" alt="" src="'+esc(a.photos[0])+'">':'')+'<b>'+esc(a.name.charAt(0))+'</b><span>'+esc(a.status)+(a.photos[0]?'':' · placeholder image')+'</span></div><div class="sc"><h3>'+esc(a.name)+'</h3><p class="loc">📍 '+esc(loc(a))+'</p>'+(a.verified?'':'<p class="loc">Details not yet verified.</p>')+cbtn(a)+'<div class="tags">'+a.services.map(function(x){return '<span>'+esc(x.n)+' R'+esc(x.p)+'</span>'}).join('')+'</div><p class="from">'+esc(S.style[0])+' about '+R(prc(a))+'</p>'+(LIVE&&!a.bookingOn?'<button class="cta" disabled>Booking not open yet</button>':'<button class="cta" data-a="salon" data-i="'+i+'">Select salon</button>')+'</div></div>'}).join(''):'<p class="sub">No salons added yet.</p>')+'</div>'}https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js
